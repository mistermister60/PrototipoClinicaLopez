<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Clínica López</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            clinica: {
              green: '#2b8243',
              navy: '#013b78',
              cyan: '#369bce',
              bg: '#f4f7f5',
              surface: '#ffffff'
            }
          },
          boxShadow: {
            'soft': '0 10px 40px -10px rgba(1, 59, 120, 0.08)',
            'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-clinica-bg text-slate-800 min-h-screen flex font-sans antialiased">


  <aside
    class="w-72 bg-clinica-surface flex flex-col min-h-screen border-r border-slate-200/70 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] fixed sm:relative">


    <div class="px-8 pt-10 pb-8 flex flex-col gap-5 items-center border-b border-slate-100">
      <div class="relative flex items-center justify-center w-20 h-24">
        <i class="fa-solid fa-shield-halved text-7xl text-clinica-green absolute"></i>
        <i class="fa-solid fa-stethoscope text-5xl text-clinica-navy absolute z-10 bottom-2"></i>
        <i class="fa-solid fa-plus text-2xl text-white absolute z-20 top-8"></i>
      </div>
      <div class="text-center">
        <h1 class="text-clinica-navy font-bold text-2xl tracking-tight leading-none uppercase">Clínica</h1>
        <h1 class="text-clinica-green font-bold text-2xl tracking-tight leading-none uppercase mt-1">López</h1>
      </div>
    </div>


    <nav class="flex-grow px-5 py-6 space-y-1.5 overflow-y-auto">
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Gestión Médica</p>

      <a href="#/" id="nav-inicio"
        class="nav-link relative flex items-center gap-4 py-3.5 px-4 rounded-xl text-slate-500 hover:text-clinica-navy hover:bg-slate-50 transition-all font-semibold group overflow-hidden">
        <i class="fa-solid fa-border-all w-5 text-center text-lg transition-colors"></i>
        <span class="tracking-wide">Resumen General</span>
      </a>

      <a href="#/pacientes" id="nav-pacientes"
        class="nav-link relative flex items-center gap-4 py-3.5 px-4 rounded-xl text-slate-500 hover:text-clinica-navy hover:bg-slate-50 transition-all font-semibold group overflow-hidden">
        <i class="fa-solid fa-users-medical w-5 text-center text-lg transition-colors"></i>
        <span class="tracking-wide">Expedientes</span>
      </a>

      <a href="#/citas" id="nav-citas"
        class="nav-link relative flex items-center gap-4 py-3.5 px-4 rounded-xl text-slate-500 hover:text-clinica-navy hover:bg-slate-50 transition-all font-semibold group overflow-hidden">
        <i class="fa-regular fa-calendar-days w-5 text-center text-lg transition-colors"></i>
        <span class="tracking-wide">Agenda Diaria</span>
      </a>

      <a href="#/medicamentos" id="nav-medicamentos"
        class="nav-link relative flex items-center gap-4 py-3.5 px-4 rounded-xl text-slate-500 hover:text-clinica-navy hover:bg-slate-50 transition-all font-semibold group overflow-hidden">
        <i class="fa-solid fa-pills w-5 text-center text-lg transition-colors"></i>
        <span class="tracking-wide">Farmacia / Stock</span>
      </a>
    </nav>


    <div
      class="p-5 border-t border-slate-100 flex items-center gap-4 cursor-pointer bg-white hover:bg-slate-50 transition-colors">
      <div class="relative">
        <img src="https://ui-avatars.com/api/?name=Dra+Lopez&background=013b78&color=fff&rounded=true&bold=true"
          alt="Dra. López" class="w-12 h-12 shadow-sm border-2 border-white">
        <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-clinica-green rounded-full border-2 border-white"></div>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-extrabold text-clinica-navy truncate">Dra. López</p>
        <p class="text-[11px] text-clinica-cyan font-bold uppercase tracking-wider truncate mt-0.5">Dir. Médica</p>
      </div>
    </div>
  </aside>


  <main class="flex-grow flex flex-col h-screen overflow-hidden relative w-full">
    <header class="bg-clinica-bg pt-10 px-8 sm:px-12 pb-6 flex justify-between items-end z-10 sticky top-0">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-clinica-cyan mb-1.5" id="page-subtitle">Panel de
          Control</p>
        <h2 id="page-title" class="text-4xl font-extrabold text-clinica-navy tracking-tight hidden sm:block">Resumen
          General</h2>
      </div>

      <div class="flex gap-4 items-center">
        <a href="#/nueva-cita"
          class="flex items-center gap-2 px-6 py-3 bg-clinica-green text-white rounded-xl shadow-[0_8px_16px_rgba(43,130,67,0.25)] hover:bg-[#236a36] hover:-translate-y-0.5 transition-all font-bold text-sm">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Registrar Cita</span>
        </a>
      </div>
    </header>

    <div id="app" class="px-8 sm:px-12 pb-12 pt-2 flex-grow overflow-y-auto"></div>
  </main>

  <script src="rutas.js"></script>
</body>

</html>
